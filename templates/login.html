<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Hireationship</title>
<style>body{font-family:system-ui,sans-serif;background:#faf5ee;color:#281d1b;display:grid;place-items:center;min-height:90vh}main{background:white;border:1px solid #eaded5;border-radius:18px;padding:2rem;width:min(90vw,380px)}input{display:block;width:100%;box-sizing:border-box;padding:.7rem;margin:.5rem 0 1rem;border:1px solid #d7c8bd;border-radius:8px}button{background:#c43d09;color:white;border:0;border-radius:9px;padding:.8rem 1.3rem;cursor:pointer}p{color:#665b55}</style></head>
<body><main><h1>Hireationship</h1><p>Private hackathon preview. Sign in with an invited account.</p>
{% if form.errors %}<p role="alert">Incorrect username or password.</p>{% endif %}
<form method="post">{% csrf_token %}<label>Username<input name="username" autocomplete="username" required autofocus></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">Sign in</button></form>
<p>Have an invite? Open the private registration link you received to create an account.</p>
</main></body></html>
