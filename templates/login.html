<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Hireationship</title>
<style>body{font-family:system-ui,sans-serif;background:#faf5ee;color:#281d1b;display:grid;place-items:center;min-height:100dvh;margin:0;padding:1rem;box-sizing:border-box}main{background:white;border:1px solid #eaded5;border-radius:18px;padding:clamp(1.25rem,5vw,2rem);box-sizing:border-box;width:min(100%,380px)}input{font-size:16px;display:block;width:100%;box-sizing:border-box;padding:.7rem;margin:.5rem 0 1rem;border:1px solid #d7c8bd;border-radius:8px}button{background:#c43d09;color:white;border:0;border-radius:9px;padding:.8rem 1.3rem;cursor:pointer}p{color:#665b55}.request{display:inline-block;padding:.75rem 1rem;border:1px solid #c43d09;border-radius:9px;color:#a3330a;text-decoration:none;font-weight:600}.small{font-size:.85rem}</style></head>
<body><main><h1>Hireationship</h1><p>Sign in to your private CV and application workspace.</p>
{% if form.errors %}<p role="alert">Incorrect username or password.</p>{% endif %}
<form method="post">{% csrf_token %}<label>Username<input name="username" autocomplete="username" required autofocus></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">Sign in</button></form>
<hr style="border:0;border-top:1px solid #eaded5;margin:1.5rem 0">
<h2 style="font-size:1.1rem">New to Hireationship?</h2>
<p>Create a free account. No invitation or paid API key required.</p>
<a class="request" href="/register/">Create free account →</a>
</main></body></html>
