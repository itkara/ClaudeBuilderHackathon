<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account · Hireationship</title>
<style>body{font-family:system-ui,sans-serif;background:#faf5ee;color:#281d1b;display:grid;place-items:center;min-height:100dvh;margin:0;padding:1rem;box-sizing:border-box}main{background:white;border:1px solid #eaded5;border-radius:18px;padding:clamp(1.25rem,5vw,2rem);box-sizing:border-box;width:min(100%,400px)}input{font-size:16px;display:block;width:100%;box-sizing:border-box;padding:.7rem;margin:.5rem 0 1rem;border:1px solid #d7c8bd;border-radius:8px}button{background:#c43d09;color:white;border:0;border-radius:9px;padding:.8rem 1.3rem;cursor:pointer}p,li{color:#665b55}a{color:#a3330a}.errorlist{color:#ad2424}</style></head>
<body><main><h1>Join Hireationship 💘</h1><p>Create an account to discover jobs and draft tailored applications.</p>
